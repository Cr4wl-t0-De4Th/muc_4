<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout-admin.html}">
<head>
</head>
<body>
    <section class="row" layout:fragment="content">
        <div class="col mt-4">
            <div class="card">
                <div class="card-header">
                    <h2 th:text="#{iotstar.value.listCate}">List Category</h2>
                </div>
                <div class="card-body">
                    <div th:if="${message != null}" class="alert alert-primary" role="alert">
                        <i>[[${message}]]</i>
                    </div>
                    
                    <div class="row mt-2 mb-2">
                        <div class="col-md-6">
                            <form th:action="@{/admin/categories/searchpaginated}">
                                <div class="input-group">
                                    <input type="text" class="form-control ml-2" name="name" id="name" placeholder="Nhập từ khóa để tìm" th:value="${name}">
                                    <button class="btn btn-outline-primary ml-2">Search</button>
                                </div>
                            </form>
                        </div>
                        <div class="col-md-6 text-end">
                            <a class="btn btn-outline-success" th:href="@{/admin/categories/add}">Add New Category</a>
                        </div>
                    </div>
                    
                    <table class="table table-striped table-inverse table-responsive" th:if="${categoryPage.hasContent()}">
                        <thead class="thead-inverse">
                            <tr>
                                <th>Category ID</th>
                                <th>Category Name</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="category, iStat : ${categoryPage.content}">
                                <td scope="row">[[${category.categoryId}]]</td>
                                <td th:text="${category.name}"></td>
                                <td>
                                    <a th:href="@{'/admin/categories/edit/' + ${category.categoryId}}" class="btn btn-outline-warning"><i class="fas fa-edit"></i> Edit</a>
                                    <a th:href="@{'/admin/categories/delete/' + ${category.categoryId}}" class="btn btn-outline-danger" onclick="return confirm('Are you sure you want to delete this category?');"><i class="fas fa-trash"></i> Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="alert alert-danger" role="alert" th:if="${!categoryPage.hasContent()}">No Category Found</div>
                </div>
                
                <div class="card-footer text-muted">
                    <form action="">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="mb-3 input-group w-auto">
                                <label for="size" class="form-label me-2 mb-0 align-self-center">Page size:</label>
                                <select class="form-select" name="size" id="size" onchange="this.form.submit()">
                                    <option th:selected="${categoryPage.size == 3}" value="3">3</option>
                                    <option th:selected="${categoryPage.size == 5}" value="5">5</option>
                                    <option th:selected="${categoryPage.size == 10}" value="10">10</option>
                                    <option th:selected="${categoryPage.size == 15}" value="15">15</option>
                                    <option th:selected="${categoryPage.size == 20}" value="20">20</option>
                                </select>
                            </div>
                            
                            <nav aria-label="Page navigation" th:if="${categoryPage.totalPages > 0}">
                                <ul class="pagination mb-0">
                                    <li th:class="${1 == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                                        <a th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=1)}" class="page-link">First</a>
                                    </li>
                                    
                                    <li class="page-item active" th:each="pageNumber : ${pageNumbers}" th:if="${categoryPage.totalPages > 1}" th:class="${pageNumber == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                                        <a th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=${pageNumber})}" class="page-link" th:text="${pageNumber}"></a>
                                    </li>
                                    
                                    <li th:class="${categoryPage.totalPages == categoryPage.number + 1} ? 'page-item active' : 'page-item'">
                                        <a th:href="@{/admin/categories/searchpaginated(name=${name}, size=${categoryPage.size}, page=${categoryPage.totalPages})}" class="page-link">Last</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
